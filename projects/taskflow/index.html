<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="header-left">
      <h1>✅ TaskFlow</h1>
      <p>Your personal Kanban board</p>
    </div>
    <button class="add-task-btn" onclick="openModal()">+ Add Task</button>
  </header>

  <div class="stats-bar">
    <div class="stat-pill"><span id="count-todo">0</span> To Do</div>
    <div class="stat-pill in"><span id="count-inprogress">0</span> In Progress</div>
    <div class="stat-pill done"><span id="count-done">0</span> Done</div>
  </div>

  <div class="board">
    <div class="column" id="col-todo" ondragover="allowDrop(event)" ondrop="drop(event,'todo')">
      <div class="col-header todo-header">
        <span class="col-dot todo-dot"></span>To Do
      </div>
      <div class="cards" id="cards-todo"></div>
    </div>
    <div class="column" id="col-inprogress" ondragover="allowDrop(event)" ondrop="drop(event,'inprogress')">
      <div class="col-header inprogress-header">
        <span class="col-dot inprogress-dot"></span>In Progress
      </div>
      <div class="cards" id="cards-inprogress"></div>
    </div>
    <div class="column" id="col-done" ondragover="allowDrop(event)" ondrop="drop(event,'done')">
      <div class="col-header done-header">
        <span class="col-dot done-dot"></span>Done
      </div>
      <div class="cards" id="cards-done"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modal-title">Add Task</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>Task Title *</label>
      <input type="text" id="task-title" placeholder="Enter task title..." />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="task-desc" placeholder="Optional description..." rows="3"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select id="task-priority">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="task-due" />
      </div>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="task-status">
        <option value="todo">To Do</option>
        <option value="inprogress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
