<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBuddy</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

/* Join screen */
#join-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 20px;
}
.join-card {
  background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 36px; width: 100%; max-width: 400px;
  text-align: center;
}
.join-card h1 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
.join-card h1 span { color: #6366f1; }
.join-card p { color: #64748b; font-size: 14px; margin-bottom: 28px; }
.join-input {
  width: 100%; padding: 12px 16px; border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.1);
  background: #0f172a; color: #e2e8f0; font-size: 15px;
  outline: none; margin-bottom: 12px; transition: border-color .2s;
}
.join-input:focus { border-color: #6366f1; }
.join-btn {
  width: 100%; padding: 13px; border-radius: 10px;
  background: #6366f1; color: #fff; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s;
}
.join-btn:hover { background: #4f46e5; }
.rooms { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
.room-chip {
  background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3);
  color: #818cf8; border-radius: 6px; padding: 5px 12px;
  font-size: 13px; cursor: pointer; transition: background .2s;
}
.room-chip:hover { background: rgba(99,102,241,0.2); }

/* Chat screen */
#chat-screen { flex: 1; display: none; flex-direction: column; }
.chat-header {
  background: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 0 20px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.chat-header-left { display: flex; align-items: center; gap: 10px; }
.room-name { font-size: 16px; font-weight: 700; }
.room-badge {
  background: rgba(99,102,241,0.15); color: #818cf8;
  border-radius: 4px; padding: 2px 8px; font-size: 12px; font-weight: 600;
}
.online-count { font-size: 12px; color: #64748b; }
.leave-btn {
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
  color: #ef4444; padding: 7px 14px; border-radius: 7px;
  font-size: 13px; font-weight: 600; cursor: pointer;
}

.chat-body { display: flex; flex: 1; overflow: hidden; }
.users-panel {
  width: 200px; border-right: 1px solid rgba(255,255,255,0.08);
  background: #1e293b; padding: 16px; overflow-y: auto; flex-shrink: 0;
}
.users-panel h4 { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.user-item { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.user-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 500; }
.you-tag { font-size: 10px; color: #64748b; margin-left: 2px; }
.online-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }

.messages-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.msg { display: flex; gap: 10px; max-width: 70%; }
.msg.own { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.msg-content {}
.msg-meta { font-size: 11px; color: #475569; margin-bottom: 3px; }
.msg.own .msg-meta { text-align: right; }
.msg-bubble {
  background: #1e293b; border-radius: 12px; padding: 10px 14px;
  font-size: 14px; line-height: 1.5;
  border: 1px solid rgba(255,255,255,0.08); max-width: 100%;
}
.msg.own .msg-bubble { background: #6366f1; border: none; color: #fff; }
.msg-time { font-size: 10px; color: #475569; margin-top: 3px; }
.msg.own .msg-time { text-align: right; }
.system-msg { text-align: center; font-size: 12px; color: #475569; padding: 4px 0; }

.chat-input-bar {
  background: #1e293b; border-top: 1px solid rgba(255,255,255,0.08);
  padding: 14px 20px; display: flex; gap: 10px;
}
#msg-input {
  flex: 1; padding: 11px 16px; border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.1);
  background: #0f172a; color: #e2e8f0; font-size: 14px;
  outline: none; transition: border-color .2s;
}
#msg-input:focus { border-color: #6366f1; }
.send-btn {
  padding: 11px 20px; border-radius: 10px;
  background: #6366f1; color: #fff; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: background .2s;
}
.send-btn:hover { background: #4f46e5; }

/* Typing indicator */
.typing-indicator { font-size: 12px; color: #475569; padding: 0 20px 8px; min-height: 20px; }
</style>
</head>
<body>

<!-- Join Screen -->
<div id="join-screen">
  <div class="join-card">
    <h1>Chat<span>Buddy</span> 💬</h1>
    <p>Real-time chat — pick a name and room to join</p>
    <input class="join-input" type="text" id="username-input" placeholder="Your name..." maxlength="20">
    <input class="join-input" type="text" id="room-input" placeholder="Room name (e.g. general)" maxlength="20">
    <button class="join-btn" onclick="joinChat()">Join Chat →</button>
    <div class="rooms">
      <span class="room-chip" onclick="pickRoom('general')">general</span>
      <span class="room-chip" onclick="pickRoom('tech')">tech</span>
      <span class="room-chip" onclick="pickRoom('random')">random</span>
      <span class="room-chip" onclick="pickRoom('music')">music</span>
    </div>
  </div>
</div>

<!-- Chat Screen -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="room-name">#<span id="room-display"></span></div>
      <span class="room-badge">Live</span>
      <span class="online-count"><span id="online-count">1</span> online</span>
    </div>
    <button class="leave-btn" onclick="leaveChat()">Leave Room</button>
  </div>
  <div class="chat-body">
    <div class="users-panel">
      <h4>Online</h4>
      <div id="users-list"></div>
    </div>
    <div class="messages-panel">
      <div id="messages"></div>
      <div class="typing-indicator" id="typing-indicator"></div>
      <div class="chat-input-bar">
        <input type="text" id="msg-input" placeholder="Type a message..." maxlength="500">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
// ChatBuddy - Simulated real-time chat (frontend demo)
// To connect a real Socket.io backend, replace the simulation with socket.emit() calls

let username = '';
let room = '';
let typingTimer = null;
const COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316'];
const BOT_USERS = ['Rahul', 'Priya', 'Amit', 'Deepa', 'Karan'];
const BOT_MSGS = [
  'Hey there! 👋', 'How are you all doing?', 'Anyone up for a code review?',
  'Just deployed a new feature 🚀', 'What are you working on today?',
  'Found a cool library — checking it out', 'Coffee time ☕', 'LGTM 👍',
  'Can someone help me debug this?', 'Weekend plans? 😄'
];

function getColor(name) { return COLORS[name.charCodeAt(0) % COLORS.length]; }
function initials(name) { return name.slice(0,2).toUpperCase(); }
function timeNow() { return new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' }); }

function pickRoom(r) { document.getElementById('room-input').value = r; }

function joinChat() {
  const u = document.getElementById('username-input').value.trim();
  const r = document.getElementById('room-input').value.trim();
  if (!u) return alert('Please enter your name.');
  if (!r) return alert('Please enter a room name.');
  username = u; room = r;
  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('room-display').textContent = room;
  addSystemMsg(`You joined #${room}`);
  renderUsers();
  startBotSimulation();
  document.getElementById('msg-input').focus();
}

function leaveChat() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('join-screen').style.display = 'flex';
  document.getElementById('messages').innerHTML = '';
}

function renderUsers() {
  const bots = BOT_USERS.slice(0, 3);
  const all = [{ name: username, isYou: true }, ...bots.map(b => ({ name: b, isYou: false }))];
  document.getElementById('online-count').textContent = all.length;
  document.getElementById('users-list').innerHTML = all.map(u => `
    <div class="user-item">
      <div class="user-avatar" style="background:${getColor(u.name)}">${initials(u.name)}</div>
      <div>
        <span class="user-name">${u.name}</span>
        ${u.isYou ? '<span class="you-tag">(you)</span>' : ''}
      </div>
    </div>
  `).join('');
}

function addMsg(sender, text, isOwn) {
  const div = document.createElement('div');
  div.className = `msg${isOwn ? ' own' : ''}`;
  div.innerHTML = `
    <div class="msg-avatar" style="background:${getColor(sender)}">${initials(sender)}</div>
    <div class="msg-content">
      <div class="msg-meta">${sender}</div>
      <div class="msg-bubble">${text}</div>
      <div class="msg-time">${timeNow()}</div>
    </div>
  `;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  addMsg(username, text, true);
  input.value = '';
  // Simulate a bot reply sometimes
  if (Math.random() > 0.5) {
    const bot = BOT_USERS[Math.floor(Math.random() * 3)];
    const delay = 1000 + Math.random() * 2000;
    const indicator = document.getElementById('typing-indicator');
    setTimeout(() => { indicator.textContent = `${bot} is typing...`; }, 600);
    setTimeout(() => {
      indicator.textContent = '';
      const msg = BOT_MSGS[Math.floor(Math.random() * BOT_MSGS.length)];
      addMsg(bot, msg, false);
    }, delay);
  }
}

function startBotSimulation() {
  // Occasional bot messages
  const sendBotMsg = () => {
    const bot = BOT_USERS[Math.floor(Math.random() * 3)];
    const msg = BOT_MSGS[Math.floor(Math.random() * BOT_MSGS.length)];
    const indicator = document.getElementById('typing-indicator');
    indicator.textContent = `${bot} is typing...`;
    setTimeout(() => { indicator.textContent = ''; addMsg(bot, msg, false); }, 1500);
    setTimeout(sendBotMsg, 8000 + Math.random() * 12000);
  };
  setTimeout(sendBotMsg, 3000);
}

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
document.getElementById('username-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('room-input').focus(); });
document.getElementById('room-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });
</script>
</body>
</html>
